<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F0ECE1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14142C" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Guia do Rito Romano na forma do Missal de São Pio V: cada peça da Missa em ordem, o que é dito, quem diz e o que muda conforme o dia."
    />
    <title>A Missa Tridentina, parte por parte | Apostolado Nossa Senhora das Neves</title>
    <link rel="icon" type="image/png" href="/brasao-pequeno.png" />
    <link rel="apple-touch-icon" href="/brasao.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema salvo antes da primeira pintura, para não piscar.
      (function () {
        try {
          var tema = localStorage.getItem("nsn:tema");
          if (tema === "claro" || tema === "escuro") {
            document.documentElement.setAttribute(
              "data-theme",
              tema === "claro" ? "light" : "dark"
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
