# Worker que serve o site e a API do painel.
# Publica em https://ansn.com.br
#
# Manualmente:  npm run publicar
# Automático:   repositório conectado em Workers Builds, no painel.

name = "apostolado-nsn"
main = "worker/index.ts"
compatibility_date = "2026-09-03"

# A conta do Apostolado, e não a pessoal. O domínio personalizado de um Worker
# só alcança zona da mesma conta, e `ansn.com.br` mora nesta:
account_id = "c23ff08c6635b3e1d1676bc86ed42d60"

# Sem endereço em workers.dev: o site tem domínio próprio, e um segundo
# endereço servindo o mesmo conteúdo só dividiria o que os buscadores veem.
workers_dev = false

# O `www` também entra como domínio do Worker, e não como um CNAME solto: o
# apex é domínio de Worker, e uma requisição com Host `www` não casaria com
# ele. Quem manda o `www` para o apex é o próprio Worker, em worker/index.ts.
routes = [
  { pattern = "ansn.com.br", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# /admin é rota do próprio site: caminho desconhecido devolve o index
not_found_handling = "single-page-application"

[vars]
# Preencher com os valores do Cloudflare Access e do repositório.
ACCESS_TEAM = "SEU-TIME"
ACCESS_AUD = "SUA-TAG-DE-AUDIENCIA"
GITHUB_REPO = "GustavoThemyus/apostolado-nsn"
GITHUB_RAMO = "main"

# GITHUB_TOKEN é segredo, não vai aqui:
#   npx wrangler@4.85.0 secret put GITHUB_TOKEN
